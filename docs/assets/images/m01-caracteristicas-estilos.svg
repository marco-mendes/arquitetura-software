<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 618" role="img" aria-labelledby="title desc">
  <title id="title">Características arquiteturais dos quatro estilos, de 1 a 5</title>
  <desc id="desc">Mapa de calor com nove características nas linhas e quatro estilos nas colunas, em escala de 1, fraco, a 5, forte. Camadas: custo geral 5, simplicidade 5, escalabilidade 2, elasticidade 1, implantabilidade 2, testabilidade 3, desempenho 3, modularidade 2, confiabilidade 3. Pipes and Filters: custo geral 5, simplicidade 5, escalabilidade 2, elasticidade 2, implantabilidade 3, testabilidade 5, desempenho 2, modularidade 5, confiabilidade 3. Microkernel: custo geral 3, simplicidade 3, escalabilidade 3, elasticidade 3, implantabilidade 3, testabilidade 3, desempenho 3, modularidade 4, confiabilidade 3. Monólito modular: custo geral 5, simplicidade 4, escalabilidade 2, elasticidade 1, implantabilidade 3, testabilidade 4, desempenho 4, modularidade 4, confiabilidade 3. As notas de Monólito modular são do curso, na mesma escala, e as notas dos demais estilos seguem Richards e Ford.</desc>
  <defs>
    <style>
      .rl { fill: #16243A; font: 400 17px Arial, sans-serif; }
      .ch { fill: #16243A; font: 700 17px Arial, sans-serif; }
      .v { font: 700 18px Arial, sans-serif; }
      .note { fill: #425466; font: 400 14px Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1020" height="618" fill="#FFFFFF"/>
  <text x="30" y="40" class="ch" style="font-size:20px">Quanto cada estilo entrega, de 1 (fraco) a 5 (forte)</text>
  <text x="325" y="78" text-anchor="middle" class="ch">Camadas</text>
  <text x="515" y="78" text-anchor="middle" class="ch">Pipes and Filters</text>
  <text x="705" y="78" text-anchor="middle" class="ch">Microkernel</text>
  <text x="895" y="78" text-anchor="middle" class="ch">Monólito modular*</text>
  <text x="214" y="120" text-anchor="end" class="rl">Custo geral</text>
  <rect x="231.5" y="93.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="325" y="120" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="421.5" y="93.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="515" y="120" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="611.5" y="93.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="120" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="93.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="895" y="120" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <text x="214" y="164" text-anchor="end" class="rl">Simplicidade</text>
  <rect x="231.5" y="137.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="325" y="164" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="421.5" y="137.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="515" y="164" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="611.5" y="137.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="164" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="137.5" width="187" height="41" rx="4" fill="#4466C4"/><text x="895" y="164" text-anchor="middle" class="v" fill="#FFFFFF">4</text>
  <text x="214" y="208" text-anchor="end" class="rl">Escalabilidade</text>
  <rect x="231.5" y="181.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="325" y="208" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="421.5" y="181.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="515" y="208" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="611.5" y="181.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="208" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="181.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="895" y="208" text-anchor="middle" class="v" fill="#16243A">2</text>
  <text x="214" y="252" text-anchor="end" class="rl">Elasticidade</text>
  <rect x="231.5" y="225.5" width="187" height="41" rx="4" fill="#EEF3FB"/><text x="325" y="252" text-anchor="middle" class="v" fill="#16243A">1</text>
  <rect x="421.5" y="225.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="515" y="252" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="611.5" y="225.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="252" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="225.5" width="187" height="41" rx="4" fill="#EEF3FB"/><text x="895" y="252" text-anchor="middle" class="v" fill="#16243A">1</text>
  <text x="214" y="296" text-anchor="end" class="rl">Implantabilidade</text>
  <rect x="231.5" y="269.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="325" y="296" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="421.5" y="269.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="515" y="296" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="611.5" y="269.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="296" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="269.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="895" y="296" text-anchor="middle" class="v" fill="#16243A">3</text>
  <text x="214" y="340" text-anchor="end" class="rl">Testabilidade</text>
  <rect x="231.5" y="313.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="325" y="340" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="421.5" y="313.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="515" y="340" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="611.5" y="313.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="340" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="313.5" width="187" height="41" rx="4" fill="#4466C4"/><text x="895" y="340" text-anchor="middle" class="v" fill="#FFFFFF">4</text>
  <text x="214" y="384" text-anchor="end" class="rl">Desempenho</text>
  <rect x="231.5" y="357.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="325" y="384" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="421.5" y="357.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="515" y="384" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="611.5" y="357.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="384" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="357.5" width="187" height="41" rx="4" fill="#4466C4"/><text x="895" y="384" text-anchor="middle" class="v" fill="#FFFFFF">4</text>
  <text x="214" y="428" text-anchor="end" class="rl">Modularidade</text>
  <rect x="231.5" y="401.5" width="187" height="41" rx="4" fill="#CCDAF3"/><text x="325" y="428" text-anchor="middle" class="v" fill="#16243A">2</text>
  <rect x="421.5" y="401.5" width="187" height="41" rx="4" fill="#254DB8"/><text x="515" y="428" text-anchor="middle" class="v" fill="#FFFFFF">5</text>
  <rect x="611.5" y="401.5" width="187" height="41" rx="4" fill="#4466C4"/><text x="705" y="428" text-anchor="middle" class="v" fill="#FFFFFF">4</text>
  <rect x="801.5" y="401.5" width="187" height="41" rx="4" fill="#4466C4"/><text x="895" y="428" text-anchor="middle" class="v" fill="#FFFFFF">4</text>
  <text x="214" y="472" text-anchor="end" class="rl">Confiabilidade</text>
  <rect x="231.5" y="445.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="325" y="472" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="421.5" y="445.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="515" y="472" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="611.5" y="445.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="705" y="472" text-anchor="middle" class="v" fill="#16243A">3</text>
  <rect x="801.5" y="445.5" width="187" height="41" rx="4" fill="#97B0E4"/><text x="895" y="472" text-anchor="middle" class="v" fill="#16243A">3</text>
  <text x="214" y="542" text-anchor="end" class="note">escala</text>
  <rect x="230" y="522" width="52" height="30" rx="4" fill="#EEF3FB"/><text x="256" y="543" text-anchor="middle" class="v" style="font-size:15px" fill="#16243A">1</text>
  <rect x="286" y="522" width="52" height="30" rx="4" fill="#CCDAF3"/><text x="312" y="543" text-anchor="middle" class="v" style="font-size:15px" fill="#16243A">2</text>
  <rect x="342" y="522" width="52" height="30" rx="4" fill="#97B0E4"/><text x="368" y="543" text-anchor="middle" class="v" style="font-size:15px" fill="#16243A">3</text>
  <rect x="398" y="522" width="52" height="30" rx="4" fill="#4466C4"/><text x="424" y="543" text-anchor="middle" class="v" style="font-size:15px" fill="#FFFFFF">4</text>
  <rect x="454" y="522" width="52" height="30" rx="4" fill="#254DB8"/><text x="480" y="543" text-anchor="middle" class="v" style="font-size:15px" fill="#FFFFFF">5</text>
  <text x="520" y="542" class="note">1 significa fraco e 5 significa forte (em custo, 5 significa custo baixo)</text>
  <text x="30" y="588" class="note">Fonte: Richards e Ford, Fundamentals of Software Architecture, caps. 10 a 12. * Monólito modular: avaliação do curso na mesma escala.</text>
</svg>
